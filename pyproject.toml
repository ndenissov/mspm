[project]
name = "mspm"
version = "2.1.0"
description = "A command-line package manager for Minecraft server plugins."
authors = [
    { name = "Nikita Denissov", email = "n.denissov@proton.me" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities"
]
[tool.poetry.dependencies]
python = ">=3.8"
selenium = [
    { version = ">=4.0.0,<4.39.0", python = ">=3.8,<3.10" },
    { version = ">=4.39.0,<5.0.0", python = ">=3.10" }
]
rich = [
    { version = ">=14.2.0,<15.0.0", python = ">=3.8,<3.9" },
    { version = ">=14.2.0,<16.0.0", python = ">=3.9" }
]
tomli-w = [
    { version = ">=1.0.0,<1.2.0", python = ">=3.8,<3.9" },
    { version = ">=1.2.0,<2.0.0", python = ">=3.9" }
]
tomli = ">=2.4.1,<3.0.0"
cloudscraper = ">=1.2.71,<2.0.0"
httpx = ">=0.28.1,<0.29.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://github.com/ndenissov/mspm"

[project.scripts]
mspm = "mspm.cli:main"