[project]
name = "mspm"
version = "2.1.0"
description = "A command-line package manager for Minecraft server plugins."
authors = [
    { name = "Nikita Denissov", email = "n.denissov@proton.me" }
]
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities"
]
dependencies = [
    "selenium>=4.0.0,<4.39.0; python_version >= '3.8' and python_version < '3.10'",
    "selenium>=4.39.0,<5.0.0; python_version >= '3.10'",
    "rich>=14.2.0,<15.0.0; python_version >= '3.8' and python_version < '3.9'",
    "rich>=14.2.0,<16.0.0; python_version >= '3.9'",
    "tomli-w>=1.0.0,<1.2.0; python_version >= '3.8' and python_version < '3.9'",
    "tomli-w>=1.2.0,<2.0.0; python_version >= '3.9'",
    "tomli>=2.4.1,<3.0.0",
    "cloudscraper>=1.2.71,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://github.com/ndenissov/mspm"

[project.scripts]
mspm = "mspm.cli:main"
